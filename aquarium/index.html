<!DOCTYPE html>
<html lang="ru">

<title>3D Аквариум — биотоп Амазонки</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b12; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8f4ff; }
  canvas { display: block; touch-action: none; }
  .panel {
    position: absolute; background: rgba(10, 22, 36, 0.62); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(140, 200, 255, 0.18); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  #ui { top: 16px; left: 16px; width: 290px; padding: 14px 16px; user-select: none; transition: transform .3s; }
  #ui.collapsed { transform: translateX(calc(-100% + 34px)); }
  #ui h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .3px; }
  #ui .sub { font-size: 12px; opacity: .65; margin: 2px 0 12px; }
  #toggleUi { position: absolute; top: 10px; right: 8px; background: none; border: none; color: #9cd2ff; font-size: 16px; cursor: pointer; padding: 4px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  button.b {
    background: rgba(60, 130, 200, 0.18); color: #e8f4ff; border: 1px solid rgba(140, 200, 255, 0.25); border-radius: 9px;
    padding: 8px 6px; font-size: 13px; cursor: pointer; transition: background .15s, border-color .15s;
  }
  button.b:hover { background: rgba(80, 160, 230, 0.32); }
  button.b.on { background: rgba(70, 170, 255, 0.42); border-color: rgba(160, 220, 255, 0.6); }
  label { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; margin: 6px 0; opacity: .9; }
  input[type=range] { width: 150px; accent-color: #5ab8ff; }
  #stats { font-size: 12px; line-height: 1.6; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(140,200,255,.15); opacity: .85; }
  #legend { margin-top: 8px; font-size: 12.5px; }
  #legend div { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
  #legend div:hover { background: rgba(120, 190, 255, 0.12); }
  #legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  #legend span { margin-left: auto; opacity: .6; }
  #card { right: 16px; top: 16px; width: 300px; padding: 16px; transition: opacity .25s, transform .25s; }
  #card.hidden { opacity: 0; transform: translateY(-10px); pointer-events: none; }
  #card h2 { margin: 0; font-size: 17px; }
  #card .lat { font-style: italic; font-size: 12.5px; opacity: .65; margin-bottom: 8px; }
  #card p { font-size: 13px; line-height: 1.5; margin: 6px 0 10px; opacity: .9; }
  #card .row { display: flex; gap: 6px; font-size: 12px; opacity: .8; margin-bottom: 10px; flex-wrap: wrap; }
  #card .row b { background: rgba(90,170,255,.15); padding: 3px 8px; border-radius: 6px; font-weight: 500; }
  #card .actions { display: flex; gap: 6px; }
  #card .actions button { flex: 1; }
  #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .55; text-align: center; padding: 0 12px; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #underwater {
    position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
    background: radial-gradient(ellipse at 50% 40%, rgba(40,140,200,0.05) 0%, rgba(10,60,100,0.35) 70%, rgba(3,25,45,0.75) 100%);
  }
  #underwater.on { opacity: 1; }
  #followBadge { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; font-size: 13px; display: none; }
  #loader { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #070b12; z-index: 10; transition: opacity .6s; font-size: 14px; opacity: 1; }
  #loader.done { opacity: 0; pointer-events: none; }
  .spinner { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(90,180,255,.2); border-top-color: #5ab8ff; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (max-width: 700px) { #ui { width: 250px; } #card { width: calc(100% - 32px); top: auto; bottom: 46px; } input[type=range] { width: 110px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<body>

<div id="ui" class="panel">
  <button id="toggleUi" title="Свернуть">◀</button>
  <h1>Амазонский аквариум</h1>
  <div class="sub">180 л · биотоп Рио-Негро · 25 °C</div>
  <div class="btns">
    <button class="b" id="bFeed">🍤 Покормить</button>
    <button class="b" id="bNight">🌙 Ночь</button>
    <button class="b on" id="bAir">🫧 Аэрация</button>
    <button class="b" id="bFollow">🎥 Следить</button>

    <button class="b" id="bFull">⛶ Экран</button>
  </div>
  <label>Течение <input type="range" id="rCurrent" min="0" max="100" value="30"></label>

</div>

<div id="card" class="panel hidden">
  <h2 id="cName"></h2>

  <div class="actions">
    <button class="b" id="cFollow">🎥 Следить</button>
    <button class="b" id="cClose">Закрыть</button>
  </div>
</div>
<div id="followBadge" class="panel">🎥 Режим слежения · Esc — выход</div>
<div id="hint">Вращение — ЛКМ / палец · Масштаб — колесо (приблизьтесь, чтобы нырнуть) · Сдвиг — ПКМ · Клик по воде — корм · Клик по рыбе — информация · F — корм, N — ночь</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== Константы и утилиты ============================== */
const V3 = THREE.Vector3;
const HW = 6, HD = 3;            // половина внутренней ширины / глубины
const TANK_H = 7.2, WATER_Y = 6.6, G = 0.1;
const FLOOR_Y = -G - 4.6;

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mixA = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const band = (x, c, w) => 1 - sstep(w * 0.55, w, Math.abs(x - c));
const lin = (a) => new THREE.Color().setRGB(a[0], a[1], a[2], THREE.SRGBColorSpace);

function hash3(x, y, z) { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = lerp(lerp(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), lerp(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v);
  const b = lerp(lerp(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), lerp(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v);
  return lerp(a, b, w);
}
function fbm(x, y, z, o = 4) {
  let a = 0.5, s = 0, n = 0;
  for (let i = 0; i < o; i++) { s += a * vnoise(x, y, z); n += a; x *= 2.03; y *= 2.03; z *= 2.03; a *= 0.5; }
  return s / n;
}

function groundY(x, z) {
  let h = 1.0 + (-z / HD) * 0.42 + (fbm(x * 0.35 + 3, 0.5, z * 0.35 + 7, 4) - 0.5) * 0.45;
  h += 0.35 * Math.exp(-((x - 2.4) ** 2 / 3 + (z + 0.9) ** 2 / 1.5));
  h += 0.25 * Math.exp(-((x + 3.6) ** 2 / 2.5 + (z + 1.2) ** 2 / 1.2));
  return h;
}

function canvasTex(w, h, draw, { repeat = [1, 1], srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* ============================== Рендерер, сцена, камера ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b12);
const roomFog = new THREE.FogExp2(0x070b12, 0.016);
const waterFog = new THREE.FogExp2(0x0c4a6c, 0.085);
scene.fog = roomFog;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.03, 200);
camera.position.set(-4, 4.6, 18);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.3, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 2.5; controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI * 0.6;
controls.autoRotateSpeed = 0.5;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const U = { time: { value: 0 }, caustic: { value: 1 }, current: { value: 0.3 } };

/* ============================== Патч шейдеров: каустика, колыхание, плавание ============================== */
const CAUSTIC_GLSL = /* glsl */`
float causticPattern(vec2 uv, float t){
  vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return clamp(pow(abs(c), 8.0), 0.0, 2.0);
}`;
const f2 = (v) => v.toFixed(3);

// Один onBeforeCompile на все варианты; customProgramCacheKey разводит программы по набору опций.
function patch(mat, opt) {
  const key = 'aq' + (opt.fish ? 'F' : '') + (opt.sway ? 'S' : '') + (opt.caustics != null ? 'C' : '');
  mat.customProgramCacheKey = () => key;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time;
    let vHead = 'uniform float uTime;\n', vBegin = '';
    if (opt.fish) {
      sh.uniforms.uSwim = opt.fish.uSwim; sh.uniforms.uAmp = opt.fish.uAmp;
      vHead += 'uniform float uSwim; uniform float uAmp;\n';
      vBegin += `
        float bw = clamp((0.28 - position.z) / 0.78, 0.0, 1.35);
        transformed.x += sin(uSwim - position.z * 7.0) * uAmp * bw * bw;
        transformed.x += sin(uSwim * 0.5 + position.y * 9.0) * 0.006 * step(0.001, abs(position.y) - 0.0) * bw;`;
    }
    if (opt.sway) {
      sh.uniforms.uCurrent = U.current;
      vHead += 'attribute float aSway; attribute float aPhase; uniform float uCurrent;\n';
      vBegin += `
        float sw = aSway * aSway;
        transformed.x += (sin(uTime * 1.15 + aPhase + position.y * 0.7) * (0.12 + uCurrent * 0.15) + uCurrent * 0.35) * sw;
        transformed.z += cos(uTime * 0.85 + aPhase * 1.7 + position.y * 0.5) * 0.1 * sw;`;
    }
    if (opt.caustics != null) {
      sh.uniforms.uCausticStr = { value: opt.caustics };
      sh.uniforms.uCausticMix = U.caustic;
      vHead += 'varying vec3 vCWPos; varying vec3 vCWN;\n';
    }
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + vHead)
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + vBegin);
    if (opt.caustics != null) {
      sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
        vec4 cwp = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          cwp = instanceMatrix * cwp;
        #endif
        vCWPos = (modelMatrix * cwp).xyz;
        vCWN = normalize(mat3(modelMatrix) * objectNormal);`);
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vCWPos; varying vec3 vCWN; uniform float uTime; uniform float uCausticStr; uniform float uCausticMix;\n' + CAUSTIC_GLSL)
        .replace('#include <dithering_fragment>', `#include <dithering_fragment>
        {
          float cm = step(abs(vCWPos.x), ${f2(HW)}) * step(abs(vCWPos.z), ${f2(HD)}) * (1.0 - smoothstep(${f2(WATER_Y - 0.25)}, ${f2(WATER_Y)}, vCWPos.y));
          float depthF = mix(1.0, 0.55, clamp((${f2(WATER_Y)} - vCWPos.y) / ${f2(WATER_Y)}, 0.0, 1.0));
          float up = 0.3 + 0.7 * clamp(vCWN.y * 0.5 + 0.5, 0.0, 1.0);
          vec2 cu = vCWPos.xz * 0.16 + vec2(vCWPos.y * 0.03);
          float cc = causticPattern(cu, uTime * 0.55) * 0.6 + causticPattern(cu * 1.43 + 0.37, uTime * 0.63) * 0.4;
          gl_FragColor.rgb += vec3(0.5, 0.8, 1.0) * cc * uCausticStr * uCausticMix * cm * depthF * up;
        }`);
    }
  };
  return mat;
}

/* ============================== Текстуры ============================== */
const grainTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#e4e4e4'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26000; i++) {
    const v = (150 + Math.random() * 105) | 0, r = Math.random() * 1.8 + 0.4;
    g.fillStyle = Math.random() < 0.12 ? `rgb(${v * 0.6 | 0},${v * 0.5 | 0},${v * 0.4 | 0})` : `rgb(${v},${v},${v * 0.95 | 0})`;
    g.fillRect(Math.random() * w, Math.random() * h, r, r);
  }
}, { repeat: [6, 3] });

const scaleTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  const s = 16;
  for (let row = -1; row < h / (s * 0.6) + 2; row++) for (let col = -1; col < w / s + 2; col++) {
    const x = col * s + (row % 2 ? s / 2 : 0), y = row * s * 0.6;
    const gr = g.createRadialGradient(x, y, 0, x, y, s * 0.75);
    gr.addColorStop(0, '#a0a0a0'); gr.addColorStop(0.75, '#7c7c7c'); gr.addColorStop(1, '#4a4a4a');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, s * 0.72, 0, Math.PI); g.fill();
  }
}, { repeat: [7, 3], srgb: false });

function woodTex(base, dark, planks, rep) {
  return canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const ph = h / planks;
    for (let p = 0; p < planks; p++) {
      const y0 = p * ph, shade = rand(-18, 18);
      g.fillStyle = `rgba(${shade > 0 ? 255 : 0},${shade > 0 ? 220 : 0},${shade > 0 ? 180 : 0},${Math.abs(shade) / 160})`;
      g.fillRect(0, y0, w, ph);
      for (let l = 0; l < 26; l++) {
        g.strokeStyle = dark; g.globalAlpha = rand(0.08, 0.3); g.lineWidth = rand(0.6, 2.2);
        g.beginPath(); const yy = y0 + rand(2, ph - 2); g.moveTo(0, yy);
        for (let x = 0; x <= w; x += 32) g.lineTo(x, yy + Math.sin(x * 0.01 + l) * rand(1, 4));
        g.stroke();
      }
      g.globalAlpha = 0.85; g.fillStyle = '#0a0604'; g.fillRect(0, y0, w, 2);
      const seam = rand(0, w); g.fillRect(seam, y0, 2, ph);
      g.globalAlpha = 1;
    }
  }, { repeat: rep });
}

/* ============================== Комната ============================== */
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90),
    new THREE.MeshStandardMaterial({ map: woodTex('#5a3d27', '#2a1a0e', 8, [10, 10]), roughness: 0.55, metalness: 0 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR_Y; floor.receiveShadow = true;
  scene.add(floor);

  const wallTex = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#1c2533'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.03})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  }, { repeat: [8, 4] });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(90, 40), new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.95 }));
  wall.position.set(0, FLOOR_Y + 20, -11); wall.receiveShadow = true; scene.add(wall);
  const skirting = new THREE.Mesh(new THREE.BoxGeometry(90, 0.5, 0.1), new THREE.MeshStandardMaterial({ color: 0x2b2f38, roughness: 0.6 }));
  skirting.position.set(0, FLOOR_Y + 0.25, -10.95); scene.add(skirting);

  // Тумба
  const cabTex = woodTex('#3a2516', '#140a04', 5, [1, 1]);
  const cabMat = new THREE.MeshStandardMaterial({ map: cabTex, roughness: 0.45, metalness: 0.05 });
  const cabW = 2 * HW + 0.9, cabD = 2 * HD + 0.9, cabH = 4.6 - 0.16;
  const top = new THREE.Mesh(new THREE.BoxGeometry(cabW + 0.2, 0.16, cabD + 0.2), cabMat);
  top.position.y = -G - 0.08; top.receiveShadow = top.castShadow = true; scene.add(top);
  const body = new THREE.Mesh(new THREE.BoxGeometry(cabW, cabH - 0.3, cabD), cabMat);
  body.position.y = -G - 0.16 - (cabH - 0.3) / 2; body.receiveShadow = body.castShadow = true; scene.add(body);
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(cabW - 0.3, 0.3, cabD - 0.3), new THREE.MeshStandardMaterial({ color: 0x120b06, roughness: 0.8 }));
  plinth.position.y = FLOOR_Y + 0.15; scene.add(plinth);
  const doorMat = new THREE.MeshStandardMaterial({ map: cabTex, roughness: 0.38, metalness: 0.05, color: 0xd8d0c8 });
  const handleMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc4, metalness: 1, roughness: 0.25 });
  const dW = cabW / 3 - 0.08, dH = cabH - 0.7;
  for (let i = 0; i < 3; i++) {
    const door = new THREE.Mesh(new THREE.BoxGeometry(dW, dH, 0.06), doorMat);
    const x = -cabW / 3 + i * cabW / 3;
    door.position.set(x, body.position.y + 0.05, cabD / 2 + 0.03); door.castShadow = door.receiveShadow = true; scene.add(door);
    const hdl = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.9, 12), handleMat);
    hdl.position.set(x + (i === 0 ? dW / 2 - 0.2 : i === 2 ? -dW / 2 + 0.2 : dW / 2 - 0.2), door.position.y + 0.9, cabD / 2 + 0.12);
    scene.add(hdl);
    for (const dy of [0.42, -0.42]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.08, 8), handleMat);
      post.rotation.x = Math.PI / 2; post.position.set(hdl.position.x, hdl.position.y + dy, cabD / 2 + 0.08); scene.add(post);
    }
  }
}

/* ============================== Свет ============================== */
const hemi = new THREE.HemisphereLight(0x9fb8d0, 0x2a2018, 0.35); scene.add(hemi);
const roomLamp = new THREE.PointLight(0xffaa66, 8, 0, 1.1); roomLamp.position.set(-14, 9, 9); scene.add(roomLamp);
const tankLight = new THREE.SpotLight(0xfff4e2, 3.2, 0, 0.42, 0.5, 0);
tankLight.position.set(1.5, 24, 2); tankLight.target.position.set(0, 0, 0);
tankLight.castShadow = true; tankLight.shadow.mapSize.set(2048, 2048);
tankLight.shadow.camera.near = 10; tankLight.shadow.camera.far = 40;

function blade(bx, bz, H, w, lean, leanDir, twist, c0, c1, seg = 12) {
  const by = groundY(bx, bz) - 0.04;

    const cx = bx + Math.cos(leanDir) * lean * t * t * H, cz = bz + Math.sin(leanDir) * lean * t * t * H;
    const cy = by + t * H * (1 - lean * 0.35 * t);

    const ww = w * 0.5 * (1 - 0.3 * t) * (t > 0.85 ? (1 - t) / 0.15 : 1) * Math.min(1, 0.5 + t * 6);
    const c = c0.clone().lerp(c1, t).multiplyScalar(jit);

function surfaceH(x, z, t) {
  let h = Math.sin(x * 1.3 + t * 1.4) * 0.022 + Math.sin(z * 1.9 - t * 1.1 + x * 0.4) * 0.018 + Math.sin((x + z) * 3.1 + t * 2.3) * 0.007;

    const age = t - r.t; if (age > 3.5) continue;
    const d = Math.hypot(x - r.x, z - r.z); if (d > age * 1.4 + 0.3) continue;
    h += Math.sin(d * 9 - age * 11) * 0.035 * r.s * Math.exp(-age * 1.3) * Math.exp(-d * 0.7);

  h += Math.sin(t * 9 + x * 7 + z * 5) * 0.02 * Math.exp(-fd * 1.4);

function surfY(sp, z, sign = 1) {
  const zs = clamp(2 * z, -1, 1), f = zs < 0 ? 1 + zs * sp.taper : 1 - zs * zs * 0.08;

}

}
const TAILS = {

function tail(sp, type, scale, color) {

}
function finGrid(def) {
  const N = 16, M = 6, pos = [], col = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const s = i / N, b = samplePoly(def.base, s), o = samplePoly(def.outer, s);
    for (let j = 0; j <= M; j++) {
      const r = j / M, u = lerp(b[0], o[0], r), v = lerp(b[1], o[1], r);
      const P = def.map ? def.map(u, v) : new V3(Math.sin(s * 14) * 0.004 * r, v, u);
      pos.push(P.x, P.y, P.z);
      const c = lin(def.color(s, r)); const ray = r > 0.12 ? 0.82 + 0.18 * Math.cos(s * Math.PI * 2 * def.rays) : 1;
      col.push(c.r * ray, c.g * ray, c.b * ray); uv.push(s, r);
    }
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) { const a = i * (M + 1) + j, b = a + M + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }

function buildBody(sp) {
  const g = new THREE.SphereGeometry(1, 64, 40); g.rotateX(Math.PI / 2);
  const p = g.attributes.position, cols = [];
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i); const zs = p.getZ(i);
    const f = zs < 0 ? 1 + zs * sp.taper : 1 - zs * zs * 0.08;
    x *= f * sp.w; y *= f * sp.h;
    if (y > 0) y *= 1 + 0.12 * (1 - zs * zs);
    else if (sp.flatBelly) y = Math.max(y, -sp.h * 0.55 * f);
    const z = zs * 0.5;
    p.setXYZ(i, x, y, z);
    const ny = clamp(y / (sp.h * Math.max(0.05, f * Math.sqrt(Math.max(0.0001, 1 - zs * zs)))), -1, 1);
    let c = sp.body(x / sp.w, ny, z);

    const cc = lin(c); cols.push(cc.r, cc.g, cc.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.computeVertexNormals();
  return g;
}

const fishes = [], fishBodies = [];
const eyeGeo = new THREE.SphereGeometry(1, 16, 12);
const pupilMat = new THREE.MeshPhysicalMaterial({ color: 0x020202, roughness: 0.05, clearcoat: 1 });

function randomTankPoint(sp) {
  const x = rand(-HW + 1.2, HW - 1.2), z = rand(-HD + 0.9, HD - 0.9), g = groundY(x, z);
  const y = sp.bottom ? g + rand(0.2, 0.4) : rand(g + 0.9, WATER_Y - 0.9);

}

class Fish {
  constructor(sp, geoBody, geoFin, irisMat) {
    this.spec = sp; this.size = rand(sp.size[0], sp.size[1]);
    this.u = { uSwim: { value: rand(0, 10) }, uAmp: { value: sp.amp } };
    const bodyMat = patch(new THREE.MeshPhysicalMaterial({
      vertexColors: true, roughness: 0.3, metalness: 0.06, clearcoat: 0.7, clearcoatRoughness: 0.25, bumpMap: scaleTex, bumpScale: 0.35,
      iridescence: sp.irid, iridescenceIOR: 1.5, iridescenceThicknessRange: [200, 650], envMapIntensity: 1.3,
    }), { fish: this.u, caustics: 0.22 });
    const finMat = patch(new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.45, transparent: true, opacity: sp.finOpacity, side: THREE.DoubleSide, depthWrite: false, iridescence: 0.3 }), { fish: this.u, caustics: 0.12 });
    if (sp.finTints) { const t = new THREE.Color(pick(sp.finTints)); finMat.color.copy(t); bodyMat.color.copy(new THREE.Color(1, 1, 1).lerp(t, 0.25)); }
    this.group = new THREE.Group(); this.inner = new THREE.Group(); this.inner.scale.setScalar(this.size); this.group.add(this.inner);
    const body = new THREE.Mesh(geoBody, bodyMat); body.castShadow = true;
    body.customDepthMaterial = patch(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), { fish: this.u });
    const fins = new THREE.Mesh(geoFin, finMat);
    this.inner.add(body, fins);
    const zE = 0.32, zs = zE * 2, r = Math.sqrt(1 - zs * zs) * (1 - zs * zs * 0.08);
    for (const s of [-1, 1]) {
      const iris = new THREE.Mesh(eyeGeo, irisMat); iris.scale.set(sp.eye * 0.55, sp.eye, sp.eye);
      iris.position.set(s * (sp.w * r - sp.eye * 0.2), sp.h * r * 0.25, zE);
      const pupil = new THREE.Mesh(eyeGeo, pupilMat); pupil.scale.setScalar(sp.eye * 0.55);
      pupil.position.set(s * (sp.w * r + sp.eye * 0.12), sp.h * r * 0.25, zE + 0.004);
      this.inner.add(iris, pupil);
    }
    body.userData.fish = this; fishBodies.push(body);
    this.pos = randomTankPoint(sp);
    this.vel = new V3(rand(-1, 1), rand(-0.2, 0.2), rand(-1, 1)).normalize().multiplyScalar(sp.speed[0] + 0.2);
    this.target = randomTankPoint(sp); this.tTimer = rand(2, 6);
    this.offset = new V3(rand(-1, 1), rand(-0.5, 0.5), rand(-1, 1)).multiplyScalar(0.9);
    this.yaw = Math.atan2(this.vel.x, this.vel.z); this.roll = 0; this.state = 'normal';

for (const sp of SPECIES) {
  const gb = buildBody(sp), gf = mergeGeometries(sp.fins(sp).map(finGrid));
  const irisMat = new THREE.MeshPhysicalMaterial({ color: sp.iris, metalness: 0.5, roughness: 0.25, clearcoat: 1 });
  sp.groupTarget = randomTankPoint(sp); sp.gtTimer = rand(3, 6);
  for (let i = 0; i < sp.count; i++) fishes.push(new Fish(sp, gb, gf, irisMat));
}

const food = [];

function dropFood(x, z, n) {
  for (let k = 0; k < n && food.length < 80; k++) {

    m.position.set(clamp(x + rand(-0.5, 0.5), -HW + 0.1, HW - 0.1), WATER_Y, clamp(z + rand(-0.35, 0.35), -HD + 0.1, HD - 0.1));
    m.scale.set(1, rand(0.35, 0.9), rand(0.8, 1.6)); m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
    scene.add(m); food.push({ mesh: m, state: 'float', t: rand(0.6, 2.5), ph: rand(0, 6.28) });
  }
  addRipple(x, z, time, 0.8);
}
function removeFood(i) { scene.remove(food[i].mesh); food.splice(i, 1); }

// Клик: отличаем от перетаскивания
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downXY = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downXY || Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 5) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(fishBodies, false)[0];
  if (hit) { showCard(hit.object.userData.fish); return; }
  const p = new V3();
  if (raycaster.ray.intersectPlane(new THREE.Plane(new V3(0, 1, 0), -WATER_Y), p) && Math.abs(p.x) < HW - 0.1 && Math.abs(p.z) < HD - 0.1) dropFood(p.x, p.z, 8);
});

addEventListener('resize', () => {

  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* ============================== Поведение рыб (стая + цели + препятствия) ============================== */
const tmp = new V3(), steer = new V3(), sep = new V3(), ali = new V3(), coh = new V3(), desired = new V3(), dir = new V3();
const m4 = new THREE.Matrix4(), qT = new THREE.Quaternion(), qRoll = new THREE.Quaternion(), ZERO = new V3(), UP = new V3(0, 1, 0), ZAX = new V3(0, 0, 1);

function seek(f, target, speed, weight) {
  desired.subVectors(target, f.pos); const d = desired.length(); if (d < 1e-4) return d;
  desired.multiplyScalar(speed * Math.min(1, d) / d).sub(f.vel).multiplyScalar(weight);
  steer.add(desired); return d;
}

function updateFish(dt) {
  const sf = lerp(1, 0.4, night);
  for (const sp of SPECIES) { sp.gtTimer -= dt; if (sp.gtTimer <= 0) { sp.gtTimer = rand(4, 9); sp.groupTarget = randomTankPoint(sp); } }
  for (const f of fishes) {
    const s = f.spec; steer.set(0, 0, 0); sep.set(0, 0, 0); ali.set(0, 0, 0); coh.set(0, 0, 0);
    let n = 0;
    for (const o of fishes) {
      if (o === f) continue;
      tmp.subVectors(f.pos, o.pos); const d = tmp.length(); if (d < 1e-4) continue;
      if (d < (f.size + o.size) * 0.65 + 0.08) sep.addScaledVector(tmp, 1 / (d * d));
      if (o.spec === s && d < s.neighbor) { ali.add(o.vel); coh.add(o.pos); n++; }
    }
    if (n) {
      ali.divideScalar(n).sub(f.vel).multiplyScalar(s.school * 0.8);
      coh.divideScalar(n).sub(f.pos).multiplyScalar(s.school * 0.5);
      steer.add(ali).add(coh);
    }
    steer.addScaledVector(sep, 0.35);

    const gY = groundY(f.pos.x, f.pos.z);
    let maxS = s.speed[1] * sf, cruise = lerp(s.speed[0], s.speed[1], 0.45) * sf;

    // Еда
    let best = null, bestD = s.bottom ? 3 : 5.5;
    for (const p of food) {
      if (s.bottom && p.state !== 'rest') continue;
      const d = f.pos.distanceTo(p.mesh.position); if (d < bestD) { bestD = d; best = p; }
    }
    if (best) {
      maxS = s.speed[1] * 1.35; seek(f, best.mesh.position, maxS, 3);
      if (bestD < f.size * 0.45 + 0.07) { removeFood(food.indexOf(best)); if (Math.random() < 0.4) spawnBubble(f.pos.x, f.pos.y, f.pos.z, 0.02); }
    } else if (f.state === 'gulp') {
      const d = seek(f, tmp.set(f.pos.x, WATER_Y - 0.1, f.pos.z), s.speed[1] * 2.2, 3); maxS = s.speed[1] * 2.2;
      if (d < 0.35) { f.state = 'return'; spawnBubble(f.pos.x, f.pos.y + 0.05, f.pos.z, 0.035); addRipple(f.pos.x, f.pos.z, time, 0.6); }
    } else if (f.state === 'return') {
      seek(f, tmp.set(f.pos.x, gY + 0.3, f.pos.z), s.speed[1] * 1.6, 2.5); maxS = s.speed[1] * 1.6;
      if (f.pos.y < gY + 0.7) f.state = 'normal';
    } else {
      f.tTimer -= dt;
      if (s.school > 0.5 && !s.bottom) seek(f, tmp.copy(s.groupTarget).add(f.offset), cruise, 1.0);
      else { if (seek(f, f.target, cruise, 0.9) < 0.5 || f.tTimer < 0) { f.target = randomTankPoint(s); f.tTimer = rand(3, 8); } }
      if (s.bottom && night < 0.5 && Math.random() < dt * 0.006) f.state = 'gulp';
    }

    // Границы и препятствия
    const m = 0.3 + f.size * 0.5;
    const minY = gY + (s.bottom ? 0.1 + f.size * 0.15 : 0.3 + f.size * 0.35);
    const maxY = (s.bottom && f.state === 'normal' && !best) ? minY + 0.6 : WATER_Y - 0.15 - f.size * 0.25;
    if (f.pos.x > HW - m) steer.x -= (f.pos.x - HW + m) * 8; if (f.pos.x < -HW + m) steer.x += (-HW + m - f.pos.x) * 8;
    if (f.pos.z > HD - m) steer.z -= (f.pos.z - HD + m) * 8; if (f.pos.z < -HD + m) steer.z += (-HD + m - f.pos.z) * 8;
    if (f.pos.y < minY) steer.y += (minY - f.pos.y) * 10; if (f.pos.y > maxY) steer.y -= (f.pos.y - maxY) * 8;
    for (const ob of obstacles) {
      tmp.subVectors(f.pos, ob.c); const d = tmp.length(), lim = ob.r + f.size * 0.6 + 0.15;
      if (d < lim && d > 1e-4) steer.addScaledVector(tmp, (lim - d) * 7 / d);
    }

    f.vel.addScaledVector(steer, dt);
    f.vel.x += U.current.value * 0.12 * dt;
    if (s.bottom && f.state === 'normal') f.vel.y *= 1 - dt * 2;
    const sp0 = f.vel.length(), minS = s.speed[0] * sf;
    if (sp0 > maxS) f.vel.multiplyScalar(maxS / sp0); else if (sp0 < minS && sp0 > 1e-5) f.vel.multiplyScalar(minS / sp0);
    f.pos.addScaledVector(f.vel, dt);
    const hm = 0.12 + f.size * 0.35;
    f.pos.x = clamp(f.pos.x, -HW + hm, HW - hm); f.pos.z = clamp(f.pos.z, -HD + hm, HD - hm);
    f.pos.y = clamp(f.pos.y, groundY(f.pos.x, f.pos.z) + 0.05 + f.size * 0.12, WATER_Y - 0.08);
    f.group.position.copy(f.pos);

    // Ориентация: ограниченный тангаж + крен на поворотах
    dir.copy(f.vel); const hl = Math.hypot(dir.x, dir.z);
    if (hl > 1e-3) {
      dir.y = clamp(dir.y, -0.6 * hl, 0.6 * hl);
      m4.lookAt(dir, ZERO, UP); qT.setFromRotationMatrix(m4);
      const yaw = Math.atan2(dir.x, dir.z); let dy = yaw - f.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); f.yaw = yaw;
      const yr = dy / Math.max(dt, 1e-3);
      f.roll = lerp(f.roll, clamp(-yr * 0.12, -0.5, 0.5), Math.min(1, dt * 3));
      qRoll.setFromAxisAngle(ZAX, f.roll); qT.multiply(qRoll);
      f.group.quaternion.slerp(qT, 1 - Math.exp(-dt * 6));
      const spd = f.vel.length();
      f.u.uSwim.value += dt * (s.beat[0] + (spd / s.speed[1]) * s.beat[1]) * (1 + Math.min(1, Math.abs(yr) * 0.3)) * lerp(1, 0.6, night);
      f.u.uAmp.value = s.amp * (0.55 + 0.6 * spd / s.speed[1]);
    }
  }
}

/* ============================== Цикл анимации ============================== */
const clock = new THREE.Clock();
let spawnAcc = 0, statT = 0, thermoT = 0;
const cDayDir = new THREE.Color(0xfff4e2), cNightDir = new THREE.Color(0x6a8cff);
const cDayLed = new THREE.Color(2.6, 2.6, 2.4), cNightLed = new THREE.Color(0.25, 0.4, 1.5);
const cDayGlow = new THREE.Color(0x58b8ff), cNightGlow = new THREE.Color(0x2a4cff);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt; U.time.value = time;

  // День / ночь
  night = lerp(night, nightTarget, 1 - Math.exp(-dt * 1.5));
  tankLight.intensity = lerp(3.2, 0.5, night) * bright; tankLight.color.copy(cDayDir).lerp(cNightDir, night);
  ledMat.color.copy(cDayLed).lerp(cNightLed, night).multiplyScalar(lerp(0.4, 1, bright / 1.6));
  tankGlow.intensity = lerp(3, 2.2, night) * bright; tankGlow.color.copy(cDayGlow).lerp(cNightGlow, night);
  hemi.intensity = lerp(0.35, 0.12, night); roomLamp.intensity = lerp(8, 14, night);
  U.caustic.value = lerp(1, 0.2, night) * bright;
  for (const r of rays) {
    r.material.uniforms.uInt.value = lerp(1, 0.12, night) * bright;
    r.rotation.y = Math.atan2(camera.position.x - r.position.x, camera.position.z - r.position.z);
  }
  // Нагреватель: включается и выключается по термостату
  const heating = thermo.t < 25.5;
  heaterCoilMat.emissiveIntensity = lerp(heaterCoilMat.emissiveIntensity, heating ? 0.9 + Math.sin(time * 3) * 0.1 : 0.05, dt * 2);
  heaterLedMat.color.setRGB(heating ? 3 : 0.3, heating ? 0.3 : 2.2, 0.2);

  // Поверхность воды
  const sp = surfGeo.attributes.position;
  for (let i = 0; i < sp.count; i++) sp.setY(i, surfaceH(sp.getX(i), sp.getZ(i), time));
  sp.needsUpdate = true; surfGeo.computeVertexNormals();
  while (ripples.length && time - ripples[0].t > 3.5) ripples.shift();

  // Пузырьки
  if (aeration) { spawnAcc += dt * 26; while (spawnAcc > 1) { spawnAcc--; spawnBubble(AIRSTONE.x + rand(-0.06, 0.06), AIRSTONE.y + 0.1, AIRSTONE.z + rand(-0.06, 0.06), rand(0.018, 0.045)); } }
  const bm = new THREE.Matrix4(), bq = new THREE.Quaternion(), bp = new V3(), bs = new V3();
  for (let i = 0; i < BMAX; i++) {
    const b = bubbles[i];
    if (b.alive) {
      b.y += b.vy * dt * (1 + b.r * 8); b.r *= 1 + dt * 0.04;
      b.x += U.current.value * 0.15 * dt;
      bp.set(b.x + Math.sin(time * 7 + b.ph) * b.wob, b.y, b.z + Math.cos(time * 6 + b.ph) * b.wob);
      if (b.y > WATER_Y + surfaceH(b.x, b.z, time) - b.r) {
        b.alive = false;
        if (time - lastRipple > 0.25) { addRipple(bp.x, bp.z, time, 0.5); lastRipple = time; }
      }
      bs.set(b.r, b.r * 0.82, b.r);
    } else bs.set(0, 0, 0);
    bubbleMesh.setMatrixAt(i, bm.compose(bp, bq, bs));
  }
  bubbleMesh.instanceMatrix.needsUpdate = true;

  // Взвесь
  const pp = particles.pos;
  for (let i = 0; i < particles.N; i++) {
    const s = particles.seeds[i], k = i * 3;
    pp[k] += (Math.sin(time * 0.3 + s) * 0.02 + U.current.value * 0.08) * dt;
    pp[k + 1] += Math.sin(time * 0.25 + s * 1.7) * 0.015 * dt - 0.004 * dt;
    pp[k + 2] += Math.cos(time * 0.2 + s * 2.3) * 0.02 * dt;
    if (pp[k] > HW) pp[k] = -HW; if (pp[k] < -HW) pp[k] = HW;
    if (pp[k + 1] < 0.8) pp[k + 1] = WATER_Y - 0.1;
  }
  particles.pts.geometry.attributes.position.needsUpdate = true;

  // Корм
  for (let i = food.length - 1; i >= 0; i--) {
    const p = food[i], m = p.mesh; p.t -= dt;
    if (p.state === 'float') {
      m.position.y = WATER_Y + surfaceH(m.position.x, m.position.z, time);
      m.position.x = clamp(m.position.x + U.current.value * 0.12 * dt, -HW + 0.1, HW - 0.1);
      if (p.t <= 0) p.state = 'sink';
    } else if (p.state === 'sink') {
      m.position.y -= dt * 0.3;
      m.position.x = clamp(m.position.x + (Math.sin(time * 2 + p.ph) * 0.08 + U.current.value * 0.05) * dt, -HW + 0.1, HW - 0.1);
      m.rotation.x += dt * 1.2; m.rotation.z += dt * 0.7;
      const gy = groundY(m.position.x, m.position.z) + 0.02;
      if (m.position.y <= gy) { m.position.y = gy; p.state = 'rest'; p.t = 30; }
    } else if (p.t <= 0) removeFood(i);
  }

  updateFish(dt);

  // Камера
  if (followFish) {
    const f = followFish;
    dir.copy(f.vel).setY(0); if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1); dir.normalize();
    tmp.copy(f.pos).addScaledVector(dir, -(1.2 + f.size * 2.2)).add(new V3(0, 0.35 + f.size * 0.4, 0));
    tmp.x = clamp(tmp.x, -HW + 0.15, HW - 0.15); tmp.z = clamp(tmp.z, -HD + 0.15, HD - 0.15); tmp.y = clamp(tmp.y, 0.6, WATER_Y - 0.1);
    camera.position.lerp(tmp, 1 - Math.exp(-dt * 2.5));
    lookTarget.lerp(f.pos, 1 - Math.exp(-dt * 6)); camera.lookAt(lookTarget);
  } else controls.update();

  const c = camera.position;
  const under = Math.abs(c.x) < HW && Math.abs(c.z) < HD && c.y < WATER_Y && c.y > 0;
  scene.fog = under ? waterFog : roomFog;
  $('underwater').classList.toggle('on', under);

  statT -= dt; thermoT -= dt;
  if (thermoT <= 0) { thermoT = 3; thermo.update(); }
  if (statT <= 0) {
    statT = 0.5;
    $('stats').innerHTML = `🐟 Рыб: <b>${fishes.length}</b> · 🍤 Корм: <b>${food.length}</b><br>🌡 ${thermo.t.toFixed(1)} °C · pH 6.6 · KH 2 · ${night > 0.5 ? '🌙 ночной режим' : '☀️ дневной свет'}${under ? '<br>🤿 Вы под водой' : ''}`;
  }

  composer.render();
}

animate();
requestAnimationFrame(() => $('loader').classList.add('done'));
</script>
<script>
  // Ошибки загрузки модулей (нет сети / WebGL) показываем на экране загрузки.
  addEventListener('error', (e) => { const t = document.getElementById('loaderText'); if (t) t.textContent = 'Ошибка: ' + (e.message || 'не удалось загрузить сцену'); }, true);
</script>
